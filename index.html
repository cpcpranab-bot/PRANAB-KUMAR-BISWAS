    <script>
      // Suppress Vite dev server WebSocket disconnect error messages in environment where HMR is disabled
      window.addEventListener('error', function (event) {
        var msg = event && (event.message || '');
        var file = event && (event.filename || '');
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || file.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>

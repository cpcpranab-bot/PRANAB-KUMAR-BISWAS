<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#002D9C" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#002D9C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />

  <!-- Dynamic Sunrise arc -->
  <path d="M 64 360 Q 256 220 448 360" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="12" stroke-linecap="round" />

  <!-- Running athlete stylized silhouette in clean white -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Head -->
    <circle cx="280" cy="130" r="38" />
    
    <!-- Torso leaning forward -->
    <path d="M 240 185 L 295 175 L 285 270 L 220 270 Z" rx="10" />

    <!-- Leading arm -->
    <path d="M 260 190 L 330 220 L 380 190" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Trailing arm -->
    <path d="M 255 195 L 195 230 L 160 210" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Leading leg in high stride -->
    <path d="M 270 270 L 330 330 L 375 390" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Trailing leg back kick -->
    <path d="M 235 270 L 175 330 L 140 310" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography tag at bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    RUN 4 BISWAS
  </text>
</svg>
